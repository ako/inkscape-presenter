</style><style>html,body{margin:0;height:100%;overflow:hidden;background:#181c20}#deck{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}[data-sd-step]{transition:opacity .45s ease}.sd-hidden{opacity:0!important;pointer-events:none}@media (prefers-reduced-motion:reduce){[data-sd-step]{transition:none}}[hidden]{display:none!important}#hud{position:fixed;right:16px;bottom:16px;display:flex;align-items:center;gap:6px;font:13px "IBM Plex Mono",Menlo,monospace;color:#e0a106;background:rgba(22,26,30,.9);border:1px solid rgba(236,238,233,.14);border-radius:999px;padding:4px 11px 4px 4px;transition:opacity .4s}#hud.idle{opacity:0;pointer-events:none}#hud .zg{display:inline-flex;gap:2px}#hud .zb{min-width:30px;padding:4px 8px}body.sd-user #deck{cursor:grab}body.sd-user #deck:active{cursor:grabbing}#hud button,#nav button{font:500 13px "IBM Plex Sans",Arial,sans-serif;color:#e6e9e4;background:transparent;border:1px solid rgba(236,238,233,.14);border-radius:999px;padding:4px 10px;cursor:pointer}#hud button:hover,#nav button:hover{background:rgba(236,238,233,.08)}#hud button:focus-visible,#nav button:focus-visible,#nav input:focus-visible,#navList li:focus-visible{outline:2px solid #e0a106;outline-offset:1px}#nav{position:fixed;z-index:5;left:16px;top:16px;bottom:16px;width:340px;max-width:calc(100% - 32px);display:flex;flex-direction:column;background:rgba(22,26,30,.94);color:#e6e9e4;border:1px solid rgba(236,238,233,.14);border-radius:12px;font:13px "IBM Plex Sans",Arial,sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}#nav header{display:flex;align-items:baseline;gap:8px;padding:12px 12px 8px 16px;border-bottom:1px solid rgba(236,238,233,.14)}#nav h2{font:500 14px "Unbounded",Arial,sans-serif;margin:0}#navSub{flex:1;color:#98a4ab;font:12px "IBM Plex Mono",Menlo,monospace}#nav .help{margin:0;padding:8px 16px 0;color:#98a4ab;font-size:12.5px;line-height:1.45}#navList{list-style:none;margin:0;padding:8px;overf
