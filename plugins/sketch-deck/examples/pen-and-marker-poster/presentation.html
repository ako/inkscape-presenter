</style><style>html,body{margin:0;height:100%;overflow:hidden;background:#181c20}#deck{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}[data-sd-step]{transition:opacity .45s ease}.sd-hidden{opacity:0!important;pointer-events:none}@media (prefers-reduced-motion:reduce){[data-sd-step]{transition:none}}[hidden]{display:none!important}#hud{position:fixed;right:16px;bottom:16px;display:flex;align-items:center;gap:6px;font:13px "IBM Plex Mono",Menlo,monospace;color:#e0a106;background:rgba(22,26,30,.9);border:1px solid rgba(236,238,233,.14);border-radius:999px;padding:4px 11px 4px 4px;transition:opacity .4s}#hud.idle{opacity:0;pointer-events:none}#hud .zg{display:inline-flex;gap:2px}#hud .zb{min-width:30px;padding:4px 8px}body.sd-user #deck{cursor:grab}body.sd-user #deck:active{cursor:grabbing}#hud button,#nav button{font:500 13px "IBM Plex Sans",Arial,sans-serif;color:#e6e9e4;background:transparent;border:1px solid rgba(236,238,233,.14);border-radius:999px;padding:4px 10px;cursor:pointer}#hud button:hover,#nav button:hover{background:rgba(236,238,233,.08)}#hud button:focus-visible,#nav button:focus-visible,#nav input:focus-visible,#navList li:focus-visible{outline:2px solid #e0a106;outline-offset:1px}#nav{position:fixed;z-index:5;left:16px;top:16px;bottom:16px;width:340px;max-width:calc(100% - 32px);display:flex;flex-direction:column;background:rgba(22,26,30,.94);color:#e6e9e4;border:1px solid rgba(236,238,233,.14);border-radius:12px;font:13px "IBM Plex Sans",Arial,sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}#nav header{display:flex;align-items:baseline;gap:8px;padding:12px 12px 8px 16px;border-bottom:1px solid rgba(236,238,233,.14)}#nav h2{font:500 14px "Unbounded",Arial,sans-serif;margin:0}#navSub{flex:1;color:#98a4ab;font:12px "IBM Plex Mono",Menlo,monospace}#nav .help{margin:0;padding:8px 16px 0;color:#98a4ab;font-size:12.5px;line-height:1.45}#navList{list-style:none;margin:0;padding:8px;overf   /* ---- navigation over the shown slides ---- */

  /* ---- slide navigator ---- */
  var thumbs = {}, dragId = null;
  // a picture of the whole slide, steps included, with every slide that

  function setShown(id, on){

  }
  function markCurrent(){
    var cur = seq[pos];
    [].forEach.call(list.children, function(li){ li.classList.toggle('current', !!cur && +li.dataset.id === cur.id); });
  }
  function renderNav(){
    if (nav.hidden) return;

      var s = byId[id], shown = arr.hidden.indexOf(id) < 0, n = seq.indexOf(s);
      var li = el('li', { 'data-id': id, draggable: 'true', class: shown ? '' : 'off', title: shown ? 'Go to this slide' : 'Hidden in this presentation' }, [

        thumb(s),
        el('span', { class: 'ttl' }, [el('span', { class: 'num', text: shown ? String(n + 1) : '–' }), document.createTextNode(' ' + s.title)]),
        el('span', { class: 'acts' }, [

          el('button', { class: 'ib', 'data-act': 'down', 'aria-label': 'Move "' + s.title + '" later', title: 'Later', text: '↓', onclick: function(e){ e.stopPropagation(); move(id, k + 1); } })

  function toggleNav(open){

  function slug(t){ return (t || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'presentation'; }

  function saveCopy(){

    var doc = document.documentElement.cloneNode(true);
    [].forEach.call(doc.querySelectorAll('.sd-hidden'), function(n){ n.classList.remove('sd-hidden'); });
    doc.querySelector('#navList').textContent = '';
    doc.querySelector('#nav').setAttribute('hidden', '');
    doc.querySelector('#navName').removeAttribute('value');
    doc.querySelector('#count').textContent = '';
    doc.querySelector('#hud').removeAttribute('class');
    doc.querySelector('#sd-arrangement').textContent = JSON.stringify(arr);
    var title = document.title + (name ? ' – ' + name : '');
    doc.querySelector('title').textContent = title;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['<!doctype html>\n' + doc.outerHTML], { type: 'text/html' }));
    a.download = slug(title) + '.html';

  }
  $('navBtn').onclick = function(){ toggleNav(); };
  $('navClose').onclick = function(){ toggleNav(false); };
  $('navAll').onclick = function(){ arr.hidden = []; rearranged(); };
  $('navReset').onclick = function(){
    try { localStorage.removeItem(storeKey); } catch (e) {}
    arr = normalize(fileArr) || { order: ids.slice(), hidden: [] }; rearranged();
  };
  $('navSave').onclick = saveCopy;


  /* ---- zoom, pan and overview ---- */
  var userView = false, overview = false, pts = {}, pinch = null, drag = null;
  function scale(){ var m = svg.getScreenCTM(); return m ? m.a : 1; }
  function toWorld(cx, cy){ var m = svg.getScreenCTM(); if (!m) return { x: cam.x + cam.w / 2, y: cam.y + cam.h / 2 }; var p = svg.createSVGPoint(); p.x = cx; p.y = cy; p = p.matrixTransform(m.inverse()); return { x: p.x, y: p.y }; }
  function setUser(on){ userView = on; document.body.classList.toggle('sd-user', on); if (!on) overview = false; showHud(); }

    setCam({ x: w.x - (w.x - cam.x) * k, y: w.y - (w.y - cam.y) * k, w: cam.w * k, h: cam.h * k });
    setUser(true);
  }
  function panBy(dx, dy){ if (!cam) return; cancelAnimationFrame(raf); var s = scale(); setCam({ x: cam.x - dx / s, y: cam.y - dy / s, w: cam.w, h: cam.h }); setUser(true); }

  function backToSlide(){ if (!seq.length) return; setUser(false); apply(); fly(frameView(seq[pos])); }
  function showOverview(){
    if (!seq.length) return;

    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    seq.forEach(function(s){ x0 = Math.min(x0, s.x); y0 = Math.min(y0, s.y); x1 = Math.max(x1, s.x + s.w); y1 = Math.max(y1, s.y + s.h); });
    var pad = (x1 - x0) * 0.03;
    slides.forEach(function(s){ var on = seq.indexOf(s) >= 0; s.steps.forEach(function(g){ g.classList.toggle('sd-hidden', !on); }); });
    setUser(true); overview = true;
    fly({ x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad });
  }
  function slideAt(cx, cy){ var w = toWorld(cx, cy), hit = -1; seq.forEach(function(s, i){ if (w.x >= s.x && w.x <= s.x + s.w && w.y >= s.y && w.y <= s.y + s.h) hit = i; }); return hit; }

    e.preventDefault();

  $('zIn').onclick = function(){ zoomCenter(0.8); };
  $('zOut').onclick = function(){ zoomCenter(1.25); };
  $('zFit').onclick = backToSlide;
  $('zAll').onclick = showOverview;
  $('fsBtn').onclick = fullscreen;

  /* ---- input ---- */
  var keys = { ArrowRight: next, ArrowDown: next, PageDown: next, ' ': next, Enter: next, ArrowLeft: prev, ArrowUp: prev, PageUp: prev, Backspace: prev,
    Home: function(){ go(0); }, End: function(){ go(seq.length - 1, true); }, f: fullscreen, F: fullscreen,
    s: function(){ toggleNav(); }, S: function(){ toggleNav(); },
    '+': function(){ zoomCenter(0.8); }, '=': function(){ zoomCenter(0.8); }, '-': function(){ zoomCenter(1.25); }, '_': function(){ zoomCenter(1.25); },
    '0': backToSlide, o: showOverview, O: showOverview };
  addEventListener('keydown', function(e){

    if (e.key === 'Escape' && !nav.hidden){ e.preventDefault(); toggleNav(false); $('navBtn').focus(); return; }

    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' && t.type === 'text') return;

  });
  var down = null;

    }

    }
  });

    delete pts[e.pointerId];
    if (pinch){ if (Object.keys(pts).length < 2) pinch = null; down = null; drag = null; return; }
    drag = null;

    var dx = e.clientX - down.x, dy = e.clientY - down.y, moved = down.moved; down = null;
    if (userView){

  go(start > 0 ? start - 1 : 0, false, true);
})();</script>
