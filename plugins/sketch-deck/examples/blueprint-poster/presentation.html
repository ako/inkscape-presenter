      s.steps.forEach(function(g, j){ g.classList.toggle('sd-hidden', i < 0 || i > pos || (i === pos && j >= step)); });
    });
    var cur = seq[pos], n = cur ? cur.steps.length : 0;
    count.textContent = cur ? (pos + 1) + ' / ' + seq.length + (n ? ' · ' + step + '/' + n : '') : 'No slides shown';
    showHud();
    try { history.replaceState(null, '', cur ? '#' + (pos + 1) : location.pathname + location.search); } catch (e) {}
    if (!nav.hidden) markCurrent();
  }
  function go(i, atEnd, instant){
    if (!seq.length){ apply(); return; }
    if (userView) setUser(false);
    pos = Math.max(0, Math.min(seq.length - 1, i));
    step = atEnd ? seq[pos].steps.length : 0;
    apply(); fly(frameView(seq[pos]), instant);
  }
  function next(){ if (!seq.length) return; if (userView){ backToSlide(); return; } if (step < seq[pos].steps.length){ step++; apply(); } else if (pos < seq.length - 1) go(pos + 1); }
  function prev(){ if (!seq.length) return; if (userView){ backToSlide(); return; } if (step > 0){ step--; apply(); } else if (pos > 0) go(pos - 1, true); }
  function fullscreen(){
    var d = document;
    if (d.fullscreenElement){ if (d.exitFullscreen) d.exitFullscreen(); return; }
    var el = d.documentElement, p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
    if (p && p.catch) p.catch(function(){});
  }
  // after a change to the arrangement: stay on the current slide, or the
  // next shown one when it was hidden
  function rearranged(){
    var cur = seq[pos];
    rebuild(); store();
    var i = cur ? seq.indexOf(cur) : -1;
    if (i < 0 && cur){
      var from = arr.order.indexOf(cur.id);
      for (var k = 0; k < arr.order.length && i < 0; k++){
        var id = arr.order[(from + k) % arr.order.length];
        if (arr.hidden.indexOf(id) < 0) i = seq.indexOf(byId[id]);
      }
    }
    if (i < 0) i = 0;
    if (i !== pos || seq[i] !== cur) go(i); else { pos = i; apply(); }
    renderNav();
  }

  /* ---- slide navigator ---- */
  var thumbs = {}, dragId = null;
  // a picture of the whole slide, steps included, with every slide that
  // shows in its view drawn too (largest first): a poster behind its zoom
  // frames, and the panels on top of a poster
  function thumb(s){
    if (thumbs[s.id]) return thumbs[s.id];
    depthRest();
    var t = document.createElementNS(NS, 'svg');
    t.setAttribute('viewBox', [s.x, s.y, s.w, s.h].join(' '));
    t.setAttribute('class', 'thumb'); t.setAttribute('aria-hidden', 'true');
    slides.filter(function(o){ return o.x < s.x + s.w && o.x + o.w > s.x && o.y < s.y + s.h && o.y + o.h > s.y; })
      .sort(function(a, b){ return b.w * b.h - a.w * a.h || (a === s ? 1 : b === s ? -1 : 0); })
      .forEach(function(o){
        var c = o.g.cloneNode(true);
        [c].concat([].slice.call(c.querySelectorAll('*'))).forEach(function(n){
          n.removeAttribute('id'); n.removeAttribute('data-sd-slide'); n.removeAttribute('data-sd-step');
          if (n.classList) n.classList.remove('sd-hidden');
        });
        t.appendChild(c);
      });
    return thumbs[s.id] = t;
  }
  function el(tag, attrs, kids){
    var e = document.createElement(tag);
    for (var k in attrs){ if (k === 'text') e.textContent = attrs[k]; else if (k.slice(0, 2) === 'on') e[k] = attrs[k]; else e.setAttribute(k, attrs[k]); }
    (kids || []).forEach(function(c){ e.appendChild(c); });
    return e;
  }
  function move(id, to){
    var o = arr.order.filter(function(x){ return x !== id; });
    o.splice(Math.max(0, Math.min(o.length, to)), 0, id);
    arr.order = o; rearranged();
  }
  function setShown(id, on){
    arr.hidden = arr.hidden.filter(function(x){ return x !== id; });
    if (!on) arr.hidden.push(id);
    rearranged();
  }
  function markCurrent(){
    var cur = seq[pos];
    [].forEach.call(list.children, function(li){ li.classList.toggle('current', !!cur && +li.dataset.id === cur.id); });
  }
  function renderNav(){
    if (nav.hidden) return;
    var focusId = document.activeElement && document.activeElement.closest && document.activeElement.closest('#navList li') ? document.activeElement.dataset.act + ':' + document.activeElement.closest('li').dataset.id : null;
    list.textContent = '';
    arr.order.forEach(function(id, k){
      var s = byId[id], shown = arr.hidden.indexOf(id) < 0, n = seq.indexOf(s);
      var li = el('li', { 'data-id': id, draggable: 'true', class: shown ? '' : 'off', title: shown ? 'Go to this slide' : 'Hidden in this presentation' }, [
        el('input', { type: 'checkbox', 'aria-label': 'Show "' + s.title + '"', 'data-act': 'show', onchange: function(e){ setShown(id, e.target.checked); } }),
        thumb(s),
        el('span', { class: 'ttl' }, [el('span', { class: 'num', text: shown ? String(n + 1) : '–' }), document.createTextNode(' ' + s.title)]),
        el('span', { class: 'acts' }, [
          el('button', { class: 'ib', 'data-act': 'up', 'aria-label': 'Move "' + s.title + '" earlier', title: 'Earlier', text: '↑', onclick: function(e){ e.stopPropagation(); move(id, k - 1); } }),
          el('button', { class: 'ib', 'data-act': 'down', 'aria-label': 'Move "' + s.title + '" later', title: 'Later', text: '↓', onclick: function(e){ e.stopPropagation(); move(id, k + 1); } })
        ])
      ]);
      li.querySelector('input').checked = shown;
      li.onclick = function(e){ if (e.target.closest('input,button')) return; var i = seq.indexOf(s); if (i >= 0) go(i); };
      li.ondragstart = function(e){ dragId = id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(id)); } catch (x) {} };
      li.ondragover = function(e){ if (dragId == null) return; e.preventDefault(); li.classList.add('dragover'); };
      li.ondragleave = function(){ li.classList.remove('dragover'); };
      li.ondrop = function(e){
        e.preventDefault(); li.classList.remove('dragover');
        if (dragId == null || dragId === id) return;
        var from = arr.order.indexOf(dragId);
        move(dragId, from < k ? k - 1 : k); dragId = null;
      };
      li.ondragend = function(){ dragId = null; };
      list.appendChild(li);
    });
    $('navSub').textContent = seq.length + ' of ' + slides.length + ' shown';
    markCurrent();
    if (focusId){
      var p = focusId.split(':'), li2 = list.querySelector('li[data-id="' + p[1] + '"]'), b = li2 && li2.querySelector('[data-act="' + p[0] + '"]');
      if (b) b.focus();
    }
  }
  function toggleNav(open){
    nav.hidden = open == null ? !nav.hidden : !open;
    $('navBtn').setAttribute('aria-expanded', String(!nav.hidden));
    if (!nav.hidden){ renderNav(); var c = list.querySelector('li.current') || list.firstChild; if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest' }); $('navClose').focus(); }
    showHud();
  }
  function slug(t){ return (t || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'presentation'; }
  // a copy of this file with the current arrangement built in
  function saveCopy(){
    var name = $('navName').value.trim();
    depthRest();
    var doc = document.documentElement.cloneNode(true);
    [].forEach.call(doc.querySelectorAll('.sd-hidden'), function(n){ n.classList.remove('sd-hidden'); });
    doc.querySelector('#navList').textContent = '';
    doc.querySelector('#nav').setAttribute('hidden', '');
    doc.querySelector('#navName').removeAttribute('value');
    doc.querySelector('#count').textContent = '';
    doc.querySelector('#hud').removeAttribute('class');
    doc.querySelector('#sd-arrangement').textContent = JSON.stringify(arr);
    var title = document.title + (name ? ' – ' + name : '');
    doc.querySelector('title').textContent = title;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['<!doctype html>\n' + doc.outerHTML], { type: 'text/html' }));
    a.download = slug(title) + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }
  $('navBtn').onclick = function(){ toggleNav(); };
  $('navClose').onclick = function(){ toggleNav(false); };
  $('navAll').onclick = function(){ arr.hidden = []; rearranged(); };
  $('navReset').onclick = function(){
    try { localStorage.removeItem(storeKey); } catch (e) {}
    arr = normalize(fileArr) || { order: ids.slice(), hidden: [] }; rearranged();
  };
  $('navSave').onclick = saveCopy;


  /* ---- zoom, pan and overview ---- */
  var userView = false, overview = false, pts = {}, pinch = null, drag = null;
  function scale(){ var m = svg.getScreenCTM(); return m ? m.a : 1; }
  function toWorld(cx, cy){ var m = svg.getScreenCTM(); if (!m) return { x: cam.x + cam.w / 2, y: cam.y + cam.h / 2 }; var p = svg.createSVGPoint(); p.x = cx; p.y = cy; p = p.matrixTransform(m.inverse()); return { x: p.x, y: p.y }; }
  function setUser(on){ userView = on; document.body.classList.toggle('sd-user', on); if (!on) overview = false; showHud(); }
  function zoomAt(cx, cy, k){
    if (!cam) return;
    cancelAnimationFrame(raf);
    var w = toWorld(cx, cy), nw = Math.max(40, Math.min(200000, cam.w * k)); k = nw / cam.w;
    setCam({ x: w.x - (w.x - cam.x) * k, y: w.y - (w.y - cam.y) * k, w: cam.w * k, h: cam.h * k });
    setUser(true);
  }
  function panBy(dx, dy){ if (!cam) return; cancelAnimationFrame(raf); var s = scale(); setCam({ x: cam.x - dx / s, y: cam.y - dy / s, w: cam.w, h: cam.h }); setUser(true); }
  function zoomCenter(k){ zoomAt(innerWidth / 2, innerHeight / 2, k); }
  function backToSlide(){ if (!seq.length) return; setUser(false); apply(); fly(frameView(seq[pos])); }
  function showOverview(){
    if (!seq.length) return;
    if (overview){ backToSlide(); return; }
    var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    seq.forEach(function(s){ x0 = Math.min(x0, s.x); y0 = Math.min(y0, s.y); x1 = Math.max(x1, s.x + s.w); y1 = Math.max(y1, s.y + s.h); });
    var pad = (x1 - x0) * 0.03;
    slides.forEach(function(s){ var on = seq.indexOf(s) >= 0; s.steps.forEach(function(g){ g.classList.toggle('sd-hidden', !on); }); });
    setUser(true); overview = true;
    fly({ x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad });
  }
  function slideAt(cx, cy){ var w = toWorld(cx, cy), hit = -1; seq.forEach(function(s, i){ if (w.x >= s.x && w.x <= s.x + s.w && w.y >= s.y && w.y <= s.y + s.h) hit = i; }); return hit; }
  svg.addEventListener('wheel', function(e){
    e.preventDefault();
    var d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    if (e.ctrlKey) zoomAt(e.clientX, e.clientY, Math.exp(d * 0.01));
    else if (userView && Math.abs(e.deltaX) >= 1) panBy(-e.deltaX, -d);
    else zoomAt(e.clientX, e.clientY, Math.exp(d * 0.0015));
  }, { passive: false });
  $('zIn').onclick = function(){ zoomCenter(0.8); };
  $('zOut').onclick = function(){ zoomCenter(1.25); };
  $('zFit').onclick = backToSlide;
  $('zAll').onclick = showOverview;
  $('fsBtn').onclick = fullscreen;

  /* ---- input ---- */
  var keys = { ArrowRight: next, ArrowDown: next, PageDown: next, ' ': next, Enter: next, ArrowLeft: prev, ArrowUp: prev, PageUp: prev, Backspace: prev,
    Home: function(){ go(0); }, End: function(){ go(seq.length - 1, true); }, f: fullscreen, F: fullscreen,
    s: function(){ toggleNav(); }, S: function(){ toggleNav(); },
    '+': function(){ zoomCenter(0.8); }, '=': function(){ zoomCenter(0.8); }, '-': function(){ zoomCenter(1.25); }, '_': function(){ zoomCenter(1.25); },
    '0': backToSlide, o: showOverview, O: showOverview };
  addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape' && !nav.hidden){ e.preventDefault(); toggleNav(false); $('navBtn').focus(); return; }
    // typing in the name field, and Enter / Space on a button or checkbox, belong to that control
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' && t.type === 'text') return;
    if ((tag === 'BUTTON' || tag === 'INPUT') && (e.key === 'Enter' || e.key === ' ')) return;
    var k = keys[e.key];
    if (k){ e.preventDefault(); k(); }
  });
  var down = null;
  function pinchState(){ var p = Object.keys(pts).map(function(k){ return pts[k]; }); if (p.length < 2) return null; var a = p[0], b = p[1]; return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  svg.addEventListener('pointerdown', function(e){
    showHud();
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    if (Object.keys(pts).length >= 2){ pinch = pinchState(); down = null; drag = null; return; }
    down = { x: e.clientX, y: e.clientY, moved: false };
    drag = { x: e.clientX, y: e.clientY };
  });
  svg.addEventListener('pointermove', function(e){
    if (!pts[e.pointerId]) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (pinch){
      var p = pinchState(); if (!p) return;
      zoomAt(p.x, p.y, pinch.d / p.d); panBy(p.x - pinch.x, p.y - pinch.y); pinch = p; return;
    }
    if (drag && userView){
      panBy(e.clientX - drag.x, e.clientY - drag.y); drag = { x: e.clientX, y: e.clientY };
      if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
    }
  });
  function lift(e){
    delete pts[e.pointerId];
    if (pinch){ if (Object.keys(pts).length < 2) pinch = null; down = null; drag = null; return; }
    drag = null;
    if (!down || e.type === 'pointercancel'){ down = null; return; }
    var dx = e.clientX - down.x, dy = e.clientY - down.y, moved = down.moved; down = null;
    if (userView){
      if (!moved && Math.abs(dx) < 8 && Math.abs(dy) < 8 && overview){ var i = slideAt(e.clientX, e.clientY); if (i >= 0){ setUser(false); go(i); } }
      return;
    }
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? next : prev)();
    else if (Math.abs(dx) < 8 && Math.abs(dy) < 8) (e.clientX < innerWidth / 2 ? prev : next)();
  }
  svg.addEventListener('pointerup', lift);
  svg.addEventListener('pointercancel', lift);
  svg.addEventListener('dblclick', function(e){ if (userView) backToSlide(); else zoomAt(e.clientX, e.clientY, 0.5); });
  addEventListener('mousemove', showHud);

  rebuild();
  var start = parseInt((location.hash || '').slice(1), 10);
  go(start > 0 ? start - 1 : 0, false, true);

  /* ---- for scripts (the video renderer): the beats of this arrangement, in order, and a
     way to step through them. A beat is a slide arriving, or one of its build steps;
     "say" is its narration (data-sd-say), or "" ---- */
  window.sketchDeck = {
    beats: function(){
      var out = [];
      seq.forEach(function(s, i){
        out.push({ slide: i, step: 0, title: s.title, say: s.g.getAttribute('data-sd-say') || '' });
        s.steps.forEach(function(g, j){ out.push({ slide: i, step: j + 1, title: s.title, say: g.getAttribute('data-sd-say') || '' }); });
      });
      return out;
    },
    go: function(slide, step){ go(slide, false, true); while (step-- > 0) next(); },
    next: next,
    state: function(){ return { slide: pos, step: step, flying: inFlight }; }
  };
})();</script>
